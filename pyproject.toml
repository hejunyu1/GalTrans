[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "galtrans"
version = "0.4.4"
description = "A safe, context-aware localization workflow for visual novels."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.scripts]
galtrans = "galtrans.cli:main"
galtrans-gui = "galtrans.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
